services:
  postgres:
    image: postgres:16-alpine
    container_name: airport_postgres
    environment:
      POSTGRES_USER: airport_admin
      POSTGRES_PASSWORD: airport_password
      POSTGRES_DB: airport_operations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: airport_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
